name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build, test, and package
        shell: powershell
        run: .\scripts\Release.ps1
      - name: Keep downloadable build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vanta-Auto-Clicker-Windows
          path: |
            dist/Vanta Auto Clicker.exe
            dist/Vanta.Auto.Clicker.Setup.exe
            dist/Vanta-Auto-Clicker-*-win.zip
            dist/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = @(Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Extension -eq '.exe' -or $_.Extension -eq '.zip' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object { $_.FullName })
          $releaseVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $PWD 'dist\Vanta Auto Clicker.exe')).ProductVersion
          $expected = 'v' + (($releaseVersion -split '\.')[0..2] -join '.')
          if ($env:RELEASE_TAG -ne $expected) { throw "Tag must match app version: $expected" }
          gh release create $env:RELEASE_TAG @files --title "Vanta Auto Clicker $env:RELEASE_TAG" --notes-file QUICKSTART.txt --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
